plugins {
    id "com.android.application"
}

android {
    namespace "rs.dnevnikgoriva"
    compileSdk 34

    defaultConfig {
        applicationId "rs.dnevnikgoriva"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    // Fixed signing key, so a newer APK installs over the old one without uninstalling.
    // The key and its password are not in the repository: the build workflow writes them
    // from the GitHub secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD.
    signingConfigs {
        stalni {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "dnevnik.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "dnevnik"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stalni }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
