plugins {
    id "com.android.application"
}

android {
    namespace "rs.dnevnikgoriva"
    compileSdk 34

    defaultConfig {
        applicationId "rs.dnevnikgoriva"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Fixed signing key, so a newer APK installs over the old one without uninstalling.
    signingConfigs {
        stalni {
            storeFile file("dnevnik.jks")
            storePassword "vls9sPryIohtZPpDwTRRLAM"
            keyAlias "dnevnik"
            keyPassword "vls9sPryIohtZPpDwTRRLAM"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stalni }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
