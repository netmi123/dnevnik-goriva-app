name: Napravi APK

on:
  push:
    branches: [main]
    paths-ignore:
      - cene.json
      - robot/**
      - .github/workflows/cene.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Pripremi ključ za potpis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Nedostaje GitHub tajna KEYSTORE_BASE64 (ključ za potpis APK-a)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/dnevnik.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/dnevnik.jks" >> "$GITHUB_ENV"

      - name: Sastavi APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Preimenuj APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DnevnikGoriva.apk

      - name: Objavi za preuzimanje
        uses: softprops/action-gh-release@v2
        with:
          tag_name: najnovija
          name: Dnevnik goriva
          body_path: OPIS.md
          files: DnevnikGoriva.apk
          make_latest: true
